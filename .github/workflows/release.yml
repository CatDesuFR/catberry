# Builds, tests and publishes one version of one catberry tool as a GitHub
# Release. Started by hand:
#   gh workflow run release.yml -f tool=ac
# The same steps run on a PC with podman: ci/release-local.sh ac
# The version comes from the tool branch's packaging/arch/PKGBUILD. A version
# that is already released is never rebuilt or overwritten.
name: release

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Which tool to release
        required: true
        type: choice
        options: [catberry, ac, mtools, roofce]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TOOL: ${{ inputs.tool }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      program: ${{ steps.tool.outputs.program }}
      version: ${{ steps.version.outputs.version }}
      rel: ${{ steps.version.outputs.rel }}
      tag: ${{ steps.version.outputs.tag }}
      existing: ${{ steps.version.outputs.existing }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - id: tool
        run: |
          case "$TOOL" in
            catberry) echo "branch=main" >> "$GITHUB_OUTPUT"; echo "program=catberry" >> "$GITHUB_OUTPUT" ;;
            ac) echo "branch=ac" >> "$GITHUB_OUTPUT"; echo "program=catberry-ac" >> "$GITHUB_OUTPUT" ;;
            mtools) echo "branch=mtools" >> "$GITHUB_OUTPUT"; echo "program=catberry-mtools" >> "$GITHUB_OUTPUT" ;;
            roofce) echo "branch=roof-carton-engine" >> "$GITHUB_OUTPUT"; echo "program=catberry-roofce" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        with:
          path: release-ci
          sparse-checkout: ci
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tool.outputs.branch }}
          path: src
      - id: version
        working-directory: src
        run: |
          version=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          rel=$(sed -n 's/^pkgrel=//p' packaging/arch/PKGBUILD)
          tag="$TOOL-v$version"
          if [ -z "$version" ] || [ -z "$rel" ]; then
            echo "::error::no pkgver/pkgrel in packaging/arch/PKGBUILD"; exit 1
          fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag is already released"; exit 1
          fi
          # A tag without a release: the release goes on it, if the program is unchanged.
          existing=no
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            source ../release-ci/ci/lib.sh
            if program_changed "$tag" HEAD; then
              echo "::error::$tag exists and the program changed since then: raise pkgver"; exit 1
            fi
            existing=yes
          fi
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          {
            echo "version=$version"
            echo "rel=$rel"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      # The tools are tested with the launcher installed: its newest release.
      - name: Fetch the launcher for the smoke tests
        if: inputs.tool == 'ac' || inputs.tool == 'mtools'
        run: |
          launcher=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' |
                     grep '^catberry-v' | sort -V | tail -1)
          if [ -z "$launcher" ]; then
            echo "::error::no catberry-v* release yet: publish catberry first"; exit 1
          fi
          mkdir launcher
          gh release download "$launcher" -R "$GITHUB_REPOSITORY" -D launcher \
            -p '*.pkg.tar.zst' -p '*.rpm' -p '*.deb'
      - if: inputs.tool == 'ac' || inputs.tool == 'mtools'
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: launcher/

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: arch
            image: archlinux:latest
          - target: fedora
            image: fedora:latest
          - target: debian13
            image: debian:13
          - target: ubuntu26.04
            image: ubuntu:26.04
          - target: windows
            image: ubuntu:26.04
    container: ${{ matrix.image }}
    env:
      PROGRAM: ${{ needs.meta.outputs.program }}
      VERSION: ${{ needs.meta.outputs.version }}
      REL: ${{ needs.meta.outputs.rel }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.target != 'windows' || inputs.tool != 'roofce'
        with:
          ref: ${{ needs.meta.outputs.sha }}
          path: src
      - uses: actions/checkout@v4
        if: matrix.target != 'windows' || inputs.tool != 'roofce'
        with:
          path: release-ci
          sparse-checkout: ci
      - if: matrix.target != 'windows' || inputs.tool != 'roofce'
        working-directory: src
        run: bash ../release-ci/ci/build.sh "${{ matrix.target }}" ../out
      - if: matrix.target != 'windows' || inputs.tool != 'roofce'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: out/*

  smoke:
    needs: [meta, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arch
            image: archlinux:latest
          - target: fedora
            image: fedora:latest
          - target: debian13
            image: debian:13
          - target: ubuntu26.04
            image: ubuntu:26.04
    container: ${{ matrix.image }}
    env:
      PROGRAM: ${{ needs.meta.outputs.program }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: pkg
      - if: inputs.tool == 'ac' || inputs.tool == 'mtools'
        uses: actions/download-artifact@v4
        with:
          name: launcher
          path: launcher
      - run: bash ci/smoke.sh "${{ matrix.target }}" pkg ${{ (inputs.tool == 'ac' || inputs.tool == 'mtools') && 'launcher' || '' }}

  publish:
    needs: [meta, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: files
          merge-multiple: true
      - working-directory: files
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release create "${{ needs.meta.outputs.tag }}" -R "$GITHUB_REPOSITORY" \
            $([ "${{ needs.meta.outputs.existing }}" = yes ] && echo --verify-tag || echo --target "${{ needs.meta.outputs.sha }}") \
            --title "$TOOL ${{ needs.meta.outputs.version }}" \
            --notes "${{ needs.meta.outputs.program }} ${{ needs.meta.outputs.version }}" \
            --latest=false -- *
